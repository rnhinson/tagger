services:
  tagger:
    build: .
    container_name: tagger
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Mount your music library here - change the left side to your path
      - /path/to/your/music:/music
      # Persists settings.json between container restarts
      - tagger-config:/config
    environment:
      - TAGGER_MUSIC_DIR=/music
      - TAGGER_CONFIG_DIR=/config

volumes:
  tagger-config:
