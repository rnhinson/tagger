name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # Backstop so a stalled apt/network step fails in minutes, not the 6h default.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ffmpeg (for audio round-trip fixtures)
        # A single apt call can hang indefinitely when GitHub's package mirror
        # blips. Kill a stalled attempt after 180s and retry, so a transient
        # hiccup self-heals instead of freezing the job.
        run: |
          for i in 1 2 3; do
            timeout 180 sudo apt-get update \
              && timeout 180 sudo apt-get install -y --no-install-recommends ffmpeg \
              && exit 0
            echo "::warning::ffmpeg install attempt $i failed or timed out; retrying in 15s"
            sleep 15
          done
          echo "::error::ffmpeg install failed after 3 attempts"
          exit 1
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
